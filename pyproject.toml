[project]
    authors = [{ name = "Nate Landau", email = "github@natenate.org" }]
    classifiers = [
        "Environment :: Console",
        "Intended Audience :: Developers",
        "Operating System :: MacOS",
        "Operating System :: POSIX :: Linux",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
        "Programming Language :: Python :: 3.15",
        "Topic :: System :: Filesystems",
        "Topic :: Utilities",
    ]
    dependencies = ["cyclopts>=5.4.0,<6", "nclutils>=4.0.0,<5.0.0", "rich>=15.0.0,<16"]
    description = "Find and clean rebuildable developer caches to free disk space."
    keywords = ["cache", "cleanup", "cli", "disk-space", "docker", "homebrew", "uv", "xcode"]
    license = "MIT"
    license-files = ["LICENSE"]
    name = "purger"
    readme = "README.md"
    requires-python = ">=3.13"
    version = "0.1.0"

    [project.urls]
        Changelog  = "https://github.com/natelandau/purger/releases"
        Homepage   = "https://github.com/natelandau/purger"
        Issues     = "https://github.com/natelandau/purger/issues"
        Repository = "https://github.com/natelandau/purger"

    [project.scripts]
        purger = "purger.cli:main"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.13.0,<0.14"]

[tool.uv.build-backend]
    module-name = "purger"

[dependency-groups]
    dev = [
        "commitizen>=4.19.3",
        "coverage>=7.17.2",
        "duty>=1.10.1",
        "gate-cache>=0.6.0",
        "prek>=0.5.10",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=7.1.0",
        "pytest-mock>=3.17.0",
        "pytest-repeat>=0.9.4",
        "pytest-sugar>=1.1.1",
        "pytest-xdist>=3.8.0",
        "pytest>=9.2.0",
        "ruff>=0.17.4",
        "shellcheck-py>=0.11.0.1",
        "ty>=0.0.100",
        "typos>=1.52.0",
        "yamllint>=1.38.0",
    ]

[tool.commitizen]
    bump_message               = "bump(release): v$current_version → v$new_version"
    changelog_merge_prerelease = true
    major_version_zero         = true
    tag_format                 = "v$version"
    update_changelog_on_bump   = true
    version_files              = ["src/purger/__init__.py:__version__"]
    version_provider           = "uv"

[tool.coverage.report] # https://coverage.readthedocs.io/en/latest/config.html#report
    exclude_lines = ['def __repr__', 'if TYPE_CHECKING', 'pragma: no cover']
    fail_under    = 90
    show_missing  = true
    skip_covered  = true
    skip_empty    = true

[tool.coverage.run]
    branch       = true
    command_line = "--module pytest"
    data_file    = ".cache/coverage"
    omit         = ["tests/*"]
    source       = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.pytest.ini_options]

    addopts        = "--color=yes --strict-config --strict-markers -n auto --dist loadfile"
    cache_dir      = ".cache/pytest"
    filterwarnings = ['error']
    testpaths      = ["tests"]
    xfail_strict   = true

[tool.ruff] # https://github.com/charliermarsh/ruff

    exclude        = [".cache", ".git", ".venv", "build", "dist"]
    fix            = true
    line-length    = 100
    output-format  = "grouped"
    src            = ["src", "tests"]
    target-version = "py313"
    [tool.ruff.lint]
        ignore = [
            "ANN002",  # Missing type annotation for `*args`
            "ANN003",  # Missing type annotation for `**kwargs`
            "ANN204",  # missing return type annotation for special method `__init__`
            "COM812",  # Trailing comma missing"
            "CPY001",  # Missing copyright notice at top of file
            "D107",    # undocumented-public-init
            "E501",    # line-too-long
            "FIX002",  # Line contains TODO, consider resolving the issue
            "PLC0415", # Imports should be at top of file
            "TD001",   # invalid-todo-tag
            "TD002",   # Missing author in TODO
            "TD003",   # Missing issue link on the line following this TODO
        ]
        per-file-ignores = { "tests/**/*.py" = [
            "A002",
            "A003",
            "ANN001",  # Missing type annotation for function argument `cls`
            "ANN002",  # Missing type annotation for `*args`
            "ANN003",  # Missing type annotation for `**kwargs`
            "ANN201",  # Missing return type annotation
            "ARG001",  # Unused function argument
            "ARG002",  # Unused method argument
            "ARG005",  # Unused lambda argument
            "D102",
            "ERA001",  # Commented out code
            "FBT001",  # Boolean-typed positional argument in function definition
            "PGH003",  # Use specific rule codes when ignoring type issues
            "PLC0415", # Imports should be at top of file
            "PLR0913",
            "PLR0917", # Too many positional arguments
            "PLR2004",
            "PLW0108", # Lambda may be unnecessary; consider inlining inner function
            "S101",
            "SLF001",  # Calling private method
        ], "src/purger/plugins/_template.py" = [
            "ERA001", # Commented-out alternatives show fields the template does not set
        ] }
        select = ["ALL"]
        unfixable = [
            "ERA001", # Commented out code
            "F401",   # unused-import
            "F841",   # unused-variable
        ]

        [tool.ruff.lint.mccabe]
            # Unlike Flake8, default to a complexity level of 10.
            max-complexity = 10

        [tool.ruff.lint.pydocstyle]
            convention = "google"

        [tool.ruff.lint.pylint]
            max-args = 7

        [tool.ruff.lint.flake8-annotations]
            allow-star-arg-any = true

    [tool.ruff.format]
        indent-style              = "space"
        line-ending               = "auto"
        quote-style               = "double"
        skip-magic-trailing-comma = false

[tool.ty.terminal]
    error-on-warning = true
